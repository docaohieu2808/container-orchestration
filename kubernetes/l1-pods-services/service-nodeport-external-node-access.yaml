# L1: Service — NodePort (External Node Access)
# NodePort exposes the Service on each Node's IP at a static port (30000–32767).
# External traffic can reach the Service via <NodeIP>:<NodePort>.
# Useful for development/testing; in production prefer LoadBalancer or Ingress.
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: demo
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
    tier: web
  ports:
    - name: http
      protocol: TCP
      port: 80          # ClusterIP port (internal)
      targetPort: 8080  # Pod container port
      nodePort: 30080   # External port on every node (30000-32767)
