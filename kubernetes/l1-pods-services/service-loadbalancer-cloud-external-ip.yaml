# L1: Service — LoadBalancer (Cloud External IP)
# LoadBalancer extends NodePort by provisioning an external load balancer via the cloud provider.
# On bare-metal/K3s, use MetalLB or ServiceLB (formerly Klipper, built into K3s) to get an external IP.
# K3s's ServiceLB assigns the node IP as the external IP (the k3s/l1 install script leaves it enabled).
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: demo
  labels:
    app: nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
    tier: web
  ports:
    - name: http
      protocol: TCP
      port: 80        # External port exposed by the load balancer
      targetPort: 8080  # Pod container port
  # On K3s, ServiceLB assigns the node IP as EXTERNAL-IP.
  # On cloud (GKE/EKS/AKS), a cloud LB is provisioned automatically.
  # On a plain kind/minikube cluster EXTERNAL-IP stays <pending> unless you add MetalLB or run a tunnel.
