# L1: Pod — Basic Single Container
# A Pod is the smallest deployable unit in Kubernetes.
# It wraps one or more containers that share network and storage.
# In production, Pods are managed by higher-level controllers (Deployment, StatefulSet).
# Direct Pod creation is used for learning, debugging, or one-off tasks.
# The image is the unprivileged nginx build: it runs as a non-root user and listens on 8080.
apiVersion: v1
kind: Pod
metadata:
  name: nginx-basic
  namespace: demo
  labels:
    app: nginx
    tier: web
spec:
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.30.6-alpine
      ports:
        - containerPort: 8080
          protocol: TCP
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 20
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Always
