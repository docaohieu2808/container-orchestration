# L4: Custom Resource — WebApp Instance Example
# A CR is a concrete instance of the CRD schema (like a Pod is an instance of the Pod schema).
# The Operator watches for WebApp objects and reconciles the desired state:
# creating/updating Deployments and Services to match spec.replicas, spec.image, etc.
# Apply after the CRD is registered: kubectl apply -f crd-webapp-custom-resource-definition.yaml
# The image must carry an explicit tag: the admission webhook in l-max rejects :latest or untagged images.
apiVersion: apps.example.com/v1alpha1
kind: WebApp
metadata:
  name: my-webapp
  namespace: demo
  labels:
    app: my-webapp
    managed-by: webapp-operator
spec:
  image: nginxinc/nginx-unprivileged:1.30.6-alpine    # The Operator will create a Deployment with this image
  replicas: 3                 # The Operator ensures this many Pods are running
  port: 8080                  # Container port; the Operator creates a Service targeting it
  env:
    - name: APP_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
# status is managed by the Operator (written via /status subresource):
# status:
#   availableReplicas: 3
#   phase: Running
