# L4: Operator Controller Deployment with RBAC
# The Operator is a controller deployed as a Pod in the cluster.
# It uses a ServiceAccount with RBAC permissions to watch WebApp CRs and
# manage child resources (Deployments, Services) on behalf of the user.
# The Operator pattern: Watch -> Diff -> Act (reconcile loop).
---
# ServiceAccount for the operator Pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-operator-sa
  namespace: demo
---
# ClusterRole: permissions needed by the operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webapp-operator-clusterrole
rules:
  # Watch and manage WebApp custom resources
  - apiGroups: ["apps.example.com"]
    resources: ["webapps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.example.com"]
    resources: ["webapps/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps.example.com"]
    resources: ["webapps/finalizers"]   # needed for blockOwnerDeletion on the child objects' OwnerReference
    verbs: ["update"]
  # Manage child Deployments and Services
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election (--leader-elect=true) stores its lock in a Lease; without this rule the
  # manager never becomes leader and reconciles nothing.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webapp-operator-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: webapp-operator-sa
    namespace: demo
roleRef:
  kind: ClusterRole
  name: webapp-operator-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
# Operator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-operator
  namespace: demo
  labels:
    app: webapp-operator
spec:
  replicas: 1       # Operators typically run as a single replica (leader election for HA)
  selector:
    matchLabels:
      app: webapp-operator
  template:
    metadata:
      labels:
        app: webapp-operator
    spec:
      serviceAccountName: webapp-operator-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Built from the l5-custom-controller code: `make docker-build` there, then load it into
          # the cluster (`kind load docker-image webapp-operator:dev`) or push it and change this line.
          image: webapp-operator:dev
          imagePullPolicy: IfNotPresent
          command: ["/manager"]
          args:
            - "--leader-elect=true"    # Enable leader election for HA deployments
            - "--namespace=demo"       # Watch only this namespace (empty = all namespaces)
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
