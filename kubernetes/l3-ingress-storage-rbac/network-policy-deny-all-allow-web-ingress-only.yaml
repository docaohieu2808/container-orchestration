# L3: NetworkPolicy — Default Deny All, Allow Web Ingress Only
# NetworkPolicy controls traffic flow at the IP/port level between Pods.
# The cluster needs a network plugin that enforces NetworkPolicy. K3s does out of the box
# (its embedded kube-router netpol controller; turn it off with --disable-network-policy),
# and kind's default kindnet does too. Without enforcement the objects apply but do nothing.
# Pattern: start with deny-all, then selectively allow required traffic (zero-trust).
---
# Step 1: Deny all ingress and egress in the namespace (zero-trust baseline).
# This also cuts egress for every Pod that no later policy selects: add an allow rule per workload.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: demo
spec:
  podSelector: {}       # Applies to ALL Pods in the namespace
  policyTypes:
    - Ingress
    - Egress
---
# Step 2: Allow ingress to web Pods only from the ingress controller namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress-from-ingress-controller
  namespace: demo
spec:
  podSelector:
    matchLabels:
      tier: web         # Only applies to Pods labeled tier=web
  policyTypes:
    - Ingress
  ingress:
    - from:
        # One "from" entry holding BOTH selectors = AND: Traefik pods in kube-system only.
        # (Two separate entries would be OR: any pod in kube-system, or any Traefik pod here.)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system   # Ingress controller namespace
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik            # Only Traefik ingress pods
      ports:
        - protocol: TCP
          port: 8080    # NetworkPolicy ports are the Pod's container ports
---
# Step 3: Allow egress from web Pods to DNS only (port 53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-egress-dns-only
  namespace: demo
spec:
  podSelector:
    matchLabels:
      tier: web
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53     # DNS resolution via kube-dns/CoreDNS
        - protocol: TCP
          port: 53
