# L3: Ingress — Host/Path Routing with TLS Termination (Traefik)
# Ingress exposes HTTP/HTTPS routes from outside the cluster to Services inside.
# It needs an Ingress controller. K3s ships Traefik, so ingressClassName is "traefik".
# (ingress-nginx was retired in March 2026, so this ladder no longer teaches it. For a
# non-K3s cluster install Traefik or another maintained controller, or move to Gateway API.)
# TLS termination happens at the Ingress; backend Services use plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress-rules
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demo.example.com
      secretName: demo-tls-secret    # TLS cert stored as a Secret (type: kubernetes.io/tls)
  rules:
    - host: demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-clusterip
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service     # Separate backend for /api prefix (not part of this lab)
                port:
                  number: 8080
