# L2: Deployment — Nginx with Rolling Update Strategy
# A Deployment manages a ReplicaSet and provides declarative updates for Pods.
# Rolling update ensures zero-downtime: new Pods are created before old ones are terminated.
# maxSurge: extra Pods allowed during update. maxUnavailable: Pods allowed to be down.
# spec.replicas is deliberately omitted: the HorizontalPodAutoscaler owns the replica count
# (setting both makes every GitOps sync fight the autoscaler). Without it the Deployment starts at 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: demo
  labels:
    app: nginx
    version: "1.0"
spec:
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # At most 1 extra Pod above desired count during update
      maxUnavailable: 0     # No Pods unavailable during update (safe rolling)
  template:
    metadata:
      labels:
        app: nginx
        tier: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config      # Inject all ConfigMap keys as env vars
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password       # Inject single Secret key as env var
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf   # Mount a single key as a file (ConfigMap key -> file)
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: app-config
            items:
              - key: nginx.conf
                path: nginx.conf
