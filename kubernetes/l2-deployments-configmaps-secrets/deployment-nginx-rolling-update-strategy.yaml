# L2: Deployment — Nginx with Rolling Update Strategy
# A Deployment manages a ReplicaSet and provides declarative updates for Pods.
# Rolling update ensures zero-downtime: new Pods are created before old ones are terminated.
# maxSurge: extra Pods allowed during update. maxUnavailable: Pods allowed to be down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: demo
  labels:
    app: nginx
    version: "1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # At most 1 extra Pod above desired count during update
      maxUnavailable: 0     # No Pods unavailable during update (safe rolling)
  template:
    metadata:
      labels:
        app: nginx
        tier: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config      # Inject all ConfigMap keys as env vars
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password       # Inject single Secret key as env var
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
