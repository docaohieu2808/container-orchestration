# L2: Secret — Database Credentials (Base64 Encoded)
# Secret stores sensitive data such as passwords, tokens, and keys.
# Values are base64-encoded (NOT encrypted by default) — enable EncryptionConfiguration
# for encryption at rest in production. Use external secret managers (Vault, ESO) for
# production-grade secret management.
#
# Generate base64 values:
#   echo -n 'myuser' | base64    => bXl1c2Vy
#   echo -n 'mypassword' | base64 => bXlwYXNzd29yZA==
#   echo -n 'mydb' | base64      => bXlkYg==
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo
  labels:
    app: nginx
type: Opaque
data:
  username: bXl1c2Vy          # base64("myuser")
  password: bXlwYXNzd29yZA==  # base64("mypassword")
  database: bXlkYg==           # base64("mydb")
  # Connection string example:
  # connection-url: cG9zdGdyZXM6Ly9teXVzZXI6bXlwYXNzd29yZEBkYi1zZXJ2aWNlOjU0MzIvbXlkYg==
  # base64("postgres://myuser:mypassword@db-service:5432/mydb")
