# L2: HorizontalPodAutoscaler — CPU and Memory Thresholds
# HPA automatically scales the number of Pod replicas based on observed metrics.
# Requires metrics-server installed in the cluster (K3s bundles it by default).
# Scale-up is fast; scale-down has a stabilization window to avoid flapping.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment    # Must match the Deployment name
  minReplicas: 2              # Never scale below this (availability floor)
  maxReplicas: 10             # Never scale above this (cost ceiling)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # Scale up when avg CPU > 70% of request
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80    # Scale up when avg memory > 80% of request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # Wait 30s before scaling up again
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60             # Add at most 2 Pods per minute
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5min before scaling down (avoid flapping)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60             # Remove at most 1 Pod per minute
