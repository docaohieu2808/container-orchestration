# L2: ConfigMap — App Config via Env Vars and File Mount
# ConfigMap decouples configuration from container images.
# Two consumption patterns shown: env var injection and volume file mount.
# Never store sensitive data in ConfigMap — use Secret for passwords/tokens.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
  labels:
    app: nginx
data:
  # Key-value pairs injected as environment variables (envFrom / env.valueFrom)
  APP_ENV: "production"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"

  # Multi-line value mounted as a file via volumeMounts (the Deployment mounts it over
  # /etc/nginx/conf.d/default.conf). The unprivileged nginx image listens on 8080.
  nginx.conf: |
    server {
        listen 8080;
        server_name _;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
