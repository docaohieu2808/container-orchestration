# L4: K3s — System Upgrade Controller Plan (Automatic K3s Version Upgrades)
# The System Upgrade Controller (SUC) watches Plan CRs and upgrades K3s nodes automatically by running
# an upgrade Job on each matching node.
#
# Install SUC first (CRDs, then the controller; the release is pinned, bump it deliberately):
#   kubectl apply -f https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.2/crd.yaml
#   kubectl apply -f https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.2/system-upgrade-controller.yaml
# The controller lives in the system-upgrade namespace and watches Plans in that same namespace.
#
# How it works:
#   1. SUC resolves the wanted version (a pinned `version:` or the `channel:` URL, polled periodically).
#   2. For each node matching nodeSelector it cordons the node (cordon: true) and runs the upgrade Job.
#   3. The agent plan's `prepare` step makes its Jobs wait until the server plan has completed, so
#      control-plane nodes are always upgraded first. Only the agent plan has a prepare step: giving the
#      server plan one that waits for the agent plan would make the two wait for each other forever.
---
# Plan for server (control-plane) nodes
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server-upgrade-plan
  namespace: system-upgrade    # SUC watches this namespace
  labels:
    k3s-upgrade: server
spec:
  concurrency: 1               # Upgrade one server at a time (preserves etcd quorum in HA)
  cordon: true                 # Stop scheduling onto the node while it upgrades
  serviceAccountName: system-upgrade
  # Follow the stable channel: upgrades to the latest stable K3s automatically.
  # To pin instead, drop `channel` and set:  version: v1.36.5+k3s1
  channel: https://update.k3s.io/v1-release/channels/stable
  upgrade:
    image: rancher/k3s-upgrade    # Official K3s upgrade image
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
---
# Plan for agent (worker) nodes — runs after the server plan has finished
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent-upgrade-plan
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  concurrency: 2               # Upgrade 2 agent nodes at a time
  cordon: true
  serviceAccountName: system-upgrade
  channel: https://update.k3s.io/v1-release/channels/stable
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist    # Only agent/worker nodes
  # Wait for the server plan: the prepare image blocks until that plan has completed.
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server-upgrade-plan"]
  upgrade:
    image: rancher/k3s-upgrade
