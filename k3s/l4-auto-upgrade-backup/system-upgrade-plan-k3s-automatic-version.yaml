# L4: K3s — System Upgrade Controller Plan (Automatic K3s Version Upgrades)
# The System Upgrade Controller (SUC) watches Plan CRs and upgrades K3s nodes
# automatically by running an upgrade job on each matching node.
# Install SUC first: kubectl apply -f https://github.com/rancher/system-upgrade-controller/releases/latest/download/system-upgrade-controller.yaml
#
# How it works:
#   1. SUC watches for Plan objects in the cattle-system namespace
#   2. When a new K3s version matches the channel, SUC drains + upgrades each node
#   3. Server nodes are upgraded before agent nodes (controlled by label selector)
---
# Plan for server (control-plane) nodes
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server-upgrade-plan
  namespace: system-upgrade    # SUC watches this namespace
  labels:
    k3s-upgrade: server
spec:
  # Track the stable channel — upgrades to latest stable K3s automatically
  channel: https://update.k3s.io/v1-release/channels/stable
  # Alternatively, pin to a specific version:
  # version: v1.28.5+k3s1

  upgrade:
    image: rancher/k3s-upgrade    # Official K3s upgrade image

  # Drain node before upgrade (graceful workload eviction)
  drain:
    force: false
    skipWaitForDeleteTimeout: 60    # Seconds to wait for pods to terminate

  # Only upgrade nodes labeled as server nodes
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]

  # Require SUC itself to be up-to-date before upgrading (safety check)
  prepare:
    image: rancher/k3s-upgrade
    command: ["prepare", "k3s-agent-upgrade-plan"]    # Wait for agent plan to be ready

  concurrency: 1    # Upgrade one server at a time (preserves etcd quorum in HA)
---
# Plan for agent (worker) nodes — runs after server upgrade
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent-upgrade-plan
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  channel: https://update.k3s.io/v1-release/channels/stable
  upgrade:
    image: rancher/k3s-upgrade
  drain:
    force: false
    skipWaitForDeleteTimeout: 60
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist    # Only agent/worker nodes
  # Only proceed after server nodes are upgraded
  prepare:
    image: rancher/k3s-upgrade
    command: ["prepare", "k3s-server-upgrade-plan"]
  concurrency: 2    # Upgrade 2 agent nodes simultaneously for speed
